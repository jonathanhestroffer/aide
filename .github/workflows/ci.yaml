name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # ------------------------------------------------------------------
  # JOB 1: VALIDATE & UNIT TEST
  # ------------------------------------------------------------------
  validate:
    name: Validate (Lint & Unit Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest tests/unit

  # ------------------------------------------------------------------
  # JOB 2: PACKAGE & INTEGRATION TEST 
  # ------------------------------------------------------------------
  package-and-test:
    name: Build & Integration Test
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -f docker/Dockerfile -t daikonn:test .

      - name: Run Integration Tests
        run: docker run --rm daikonn:test uv run pytest tests/integration