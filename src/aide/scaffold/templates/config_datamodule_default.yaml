train_dataset:
  class_name: procedural_shapes
  params:
    num_samples: 5000
    img_size: 32
    noise_level: 0.15

val_dataset:
  class_name: procedural_shapes
  params:
    num_samples: 1000
    img_size: 32
    noise_level: 0.15

transforms:
  - class_name: AIDE_normalize
    params:
      apply_to: [all]
  - class_name: AIDE_random_crop
    params:
      apply_to: [train]

global_dataloader:
  batch_size: 32
  num_workers: 10
  persistent_workers: true

train_dataloader:
  shuffle: true

val_dataloader:
  shuffle: false